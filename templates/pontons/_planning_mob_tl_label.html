<div id="mob-tl-label-{{ row.embarcation.pk }}" class="mob-tl-label">
  <span class="color-dot" style="background:{{ row.embarcation.couleur }};"></span>
  <span class="tl-label-text">
    <span class="tl-label-name" title="{{ row.embarcation.nom }}">{{ row.embarcation.nom }}</span>
  </span>
  {% if role == 'gestionnaire' or role == 'admin' %}
    {% if row.statut == 'sortie' %}
    <form hx-post="{% url 'retour_embarcation' row.embarcation.pk %}" hx-target="#mob-tl-row-{{ row.embarcation.pk }}" hx-swap="outerHTML" hx-vals="js:{window_start: WINDOW_START_ISO}">{% csrf_token %}
      <input type="hidden" name="_htmx_partial" value="planning_mob_tl">
      <input type="hidden" name="next" value="planning">
      <button type="submit" class="btn btn-retour" aria-label="Retour — {{ row.embarcation.nom }}">Retour</button>
    </form>
    {% elif row.statut == 'reservee' %}
    <form hx-post="{% url 'sortir_embarcation' row.embarcation.pk %}" hx-target="#mob-tl-row-{{ row.embarcation.pk }}" hx-swap="outerHTML" hx-vals="js:{window_start: WINDOW_START_ISO}">{% csrf_token %}
      <input type="hidden" name="_htmx_partial" value="planning_mob_tl">
      <input type="hidden" name="next" value="planning">
      <button type="submit" class="btn btn-sortir" aria-label="Sortir — {{ row.embarcation.nom }}">Sortir</button>
    </form>
    {% else %}
    <form hx-post="{% url 'louer_embarcation' row.embarcation.pk %}" hx-target="#mob-tl-row-{{ row.embarcation.pk }}" hx-swap="outerHTML" hx-vals="js:{window_start: WINDOW_START_ISO}">{% csrf_token %}
      <input type="hidden" name="_htmx_partial" value="planning_mob_tl">
      <input type="hidden" name="notes" value="">
      <input type="hidden" name="next" value="planning">
      <button type="submit" class="btn btn-vendre" aria-label="Vendre un ticket — {{ row.embarcation.nom }}">Vendre</button>
    </form>
    {% endif %}
  {% endif %}
</div>
