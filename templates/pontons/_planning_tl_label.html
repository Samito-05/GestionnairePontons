<div id="tl-label-{{ row.embarcation.pk }}" class="tl-label">
  <div style="display:flex;align-items:center;gap:.4rem;">
    <span class="color-dot" style="background:{{ row.embarcation.couleur }};flex-shrink:0;"></span>
    {% if role == 'gestionnaire' or role == 'admin' %}
      {% if row.statut == 'sortie' %}
      <form hx-post="{% url 'retour_embarcation' row.embarcation.pk %}" hx-target="#tl-label-{{ row.embarcation.pk }}" hx-swap="outerHTML" style="margin:0;">{% csrf_token %}
        <input type="hidden" name="_htmx_partial" value="planning_tl">
        <input type="hidden" name="next" value="planning">
        <button type="submit" class="btn btn-danger btn-xs">Retour</button>
      </form>
      {% elif row.statut == 'reservee' %}
      <form hx-post="{% url 'sortir_embarcation' row.embarcation.pk %}" hx-target="#tl-label-{{ row.embarcation.pk }}" hx-swap="outerHTML" style="margin:0;">{% csrf_token %}
        <input type="hidden" name="_htmx_partial" value="planning_tl">
        <input type="hidden" name="next" value="planning">
        <button type="submit" class="btn btn-warning btn-xs">Sortir</button>
      </form>
      {% else %}
      <form hx-post="{% url 'louer_embarcation' row.embarcation.pk %}" hx-target="#tl-label-{{ row.embarcation.pk }}" hx-swap="outerHTML" style="margin:0;">{% csrf_token %}
        <input type="hidden" name="_htmx_partial" value="planning_tl">
        <input type="hidden" name="notes" value="">
        <input type="hidden" name="next" value="planning">
        <button type="submit" class="btn btn-success btn-xs">Vente</button>
      </form>
      {% endif %}
    {% endif %}
  </div>
</div>
