<div id="tl-row-{{ row.embarcation.pk }}" class="tl-row tl-row-emb{% if row.statut == 'reservee' %} is-reserved{% endif %}">
  {% include 'pontons/_planning_tl_label.html' with row=row %}
  <div class="tl-track">
    {% for m in marks %}
      <div class="{% if m.is_hour %}grid-h{% else %}grid-hh{% endif %}" style="left:{{ m.pct }}%"></div>
    {% endfor %}
    {% for block in row.blocks %}
      {% if block.is_overtime %}
      <div class="overtime-block"
           style="left:{{ block.left_pct }}%;width:{{ block.width_pct }}%;"
           title="{{ block.label }}"></div>
      {% elif block.is_reserved %}
      <div class="reserved-block"
           style="left:{{ block.left_pct }}%;width:{{ block.width_pct }}%;"
           title="{{ block.label }}"></div>
      {% else %}
      <div class="rental-block"
           style="left:{{ block.left_pct }}%;width:{{ block.width_pct }}%;background:{{ block.color }};color:{{ block.text_color }};"
           title="{{ block.label }}">
        {{ block.label }}
      </div>
      {% endif %}
    {% endfor %}
  </div>
  {% if row.statut == 'sortie' %}
  <span style="display:none"
        hx-get="{% url 'planning_row_partial' row.embarcation.pk %}?partial=planning_tl"
        hx-trigger="every 20s"
        hx-target="#tl-row-{{ row.embarcation.pk }}"
        hx-swap="outerHTML"
        hx-vals="js:{grid_start:GRID_START_H,grid_end:GRID_END_H}"></span>
  {% endif %}
</div>
