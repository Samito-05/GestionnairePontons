{% extends 'base.html' %}

{% block content %}
{% with url_name=request.resolver_match.url_name|default:'' %}
<div class="admin-layout">

  <!-- Menu latéral (bureau) / onglets défilants (mobile) -->
  <aside class="admin-sidebar">
    <nav aria-label="Administration">
      <span class="sidebar-heading">Vue d'ensemble</span>
      <a href="{% url 'admin_dashboard' %}" class="sidebar-link {% if url_name == 'admin_dashboard' %}active{% endif %}">
        <svg class="icon"><use href="#i-dashboard"/></svg>Tableau de bord
      </a>

      <span class="sidebar-heading">Flotte</span>
      <a href="{% url 'admin_pontons' %}" class="sidebar-link {% if 'admin_ponton' in url_name %}active{% endif %}">
        <svg class="icon"><use href="#i-anchor"/></svg>Pontons
      </a>
      <a href="{% url 'admin_embarcations' %}" class="sidebar-link {% if 'admin_embarcation' in url_name %}active{% endif %}">
        <svg class="icon"><use href="#i-boat"/></svg>Embarcations
      </a>
      <a href="{% url 'admin_locations' %}" class="sidebar-link {% if 'admin_location' in url_name %}active{% endif %}">
        <svg class="icon"><use href="#i-ticket"/></svg>Locations
      </a>

      <span class="sidebar-heading">Accès</span>
      <a href="{% url 'admin_users' %}" class="sidebar-link {% if 'admin_user' in url_name %}active{% endif %}">
        <svg class="icon"><use href="#i-users"/></svg>Utilisateurs
      </a>

      <span class="sidebar-heading sidebar-secondary">Exploitation</span>
      <a href="{% url 'planning' %}" class="sidebar-link sidebar-secondary"><svg class="icon"><use href="#i-calendar"/></svg>Planning</a>
      <a href="{% url 'gestionnaire' %}" class="sidebar-link sidebar-secondary"><svg class="icon"><use href="#i-boat"/></svg>Sorties</a>
    </nav>
  </aside>

  <div class="admin-main">
    {% block admin_content %}{% endblock %}
  </div>

</div>
{% endwith %}
{% endblock %}
