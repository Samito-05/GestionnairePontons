<div id="mob-tl-label-{{ row.embarcation.pk }}" class="mob-tl-label">
  <div style="display:flex;align-items:center;gap:.3rem;overflow:hidden;">
    <span class="color-dot" style="background:{{ row.embarcation.couleur }};flex-shrink:0;"></span>
    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:.72rem;flex:1;min-width:0;">{{ row.embarcation.nom }}</span>
    {% if role == 'gestionnaire' or role == 'admin' %}
      {% if row.statut == 'sortie' %}
      <form hx-post="{% url 'retour_embarcation' row.embarcation.pk %}" hx-target="#mob-tl-label-{{ row.embarcation.pk }}" hx-swap="outerHTML" style="margin:0;flex-shrink:0;">{% csrf_token %}
        <input type="hidden" name="_htmx_partial" value="planning_mob_tl">
        <input type="hidden" name="next" value="planning">
        <button type="submit" class="btn btn-danger btn-xs">Retour</button>
      </form>
      {% elif row.statut == 'reservee' %}
      <form hx-post="{% url 'sortir_embarcation' row.embarcation.pk %}" hx-target="#mob-tl-label-{{ row.embarcation.pk }}" hx-swap="outerHTML" style="margin:0;flex-shrink:0;">{% csrf_token %}
        <input type="hidden" name="_htmx_partial" value="planning_mob_tl">
        <input type="hidden" name="next" value="planning">
        <button type="submit" class="btn btn-warning btn-xs">Sortir</button>
      </form>
      {% else %}
      <form hx-post="{% url 'louer_embarcation' row.embarcation.pk %}" hx-target="#mob-tl-label-{{ row.embarcation.pk }}" hx-swap="outerHTML" style="margin:0;flex-shrink:0;">{% csrf_token %}
        <input type="hidden" name="_htmx_partial" value="planning_mob_tl">
        <input type="hidden" name="notes" value="">
        <input type="hidden" name="next" value="planning">
        <button type="submit" class="btn btn-success btn-xs">Vente</button>
      </form>
      {% endif %}
    {% endif %}
  </div>
</div>
