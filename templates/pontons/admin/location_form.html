{% extends 'pontons/admin/base_admin.html' %}
{% block title %}{{ titre }}{% endblock %}

{% block admin_content %}
<div class="page-header">
  <h1 class="page-title">{{ titre }}</h1>
  <a href="{% url 'admin_locations' %}" class="btn btn-ghost"><svg class="icon"><use href="#i-arrow-left"/></svg>Locations</a>
</div>

<div class="form-panel">
  <form method="post">
    {% csrf_token %}
    <div class="notice">
      <svg class="icon" aria-hidden="true"><use href="#i-info"/></svg>
      <span>Fin prévue vide : elle est fixée à début + 1 h.</span>
    </div>
    {% include 'pontons/admin/_form_fields.html' %}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary btn-lg">Enregistrer</button>
      <a href="{% url 'admin_locations' %}" class="btn btn-ghost btn-lg">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
