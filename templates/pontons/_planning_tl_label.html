<div id="tl-label-{{ row.embarcation.pk }}" class="tl-label">
  <div style="display:flex;align-items:center;gap:.35rem;overflow:hidden;">
    <span class="color-dot" style="background:{{ row.embarcation.couleur }};"></span>
    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:.8rem;">
      {{ row.embarcation.nom }}
    </span>
  </div>
  {% if role == 'gestionnaire' or role == 'admin' %}
  <div class="tl-label-btns">
    {% if row.statut == 'sortie' %}
    <form hx-post="{% url 'retour_embarcation' row.embarcation.pk %}"
          hx-target="#tl-label-{{ row.embarcation.pk }}"
          hx-swap="outerHTML">{% csrf_token %}
      <input type="hidden" name="_htmx_partial" value="planning_tl">
      <input type="hidden" name="next" value="planning">
      <button type="submit" class="btn btn-danger btn-xs">Retour</button>
    </form>
    {% elif row.statut == 'reservee' %}
    <form hx-post="{% url 'sortir_embarcation' row.embarcation.pk %}"
          hx-target="#tl-label-{{ row.embarcation.pk }}"
          hx-swap="outerHTML">{% csrf_token %}
      <input type="hidden" name="_htmx_partial" value="planning_tl">
      <input type="hidden" name="next" value="planning">
      <button type="submit" class="btn btn-warning btn-xs">Sortir</button>
    </form>
    {% else %}
    <form hx-post="{% url 'louer_embarcation' row.embarcation.pk %}"
          hx-target="#tl-label-{{ row.embarcation.pk }}"
          hx-swap="outerHTML">{% csrf_token %}
      <input type="hidden" name="_htmx_partial" value="planning_tl">
      <input type="hidden" name="notes" value="">
      <input type="hidden" name="next" value="planning">
      <button type="submit" class="btn btn-success btn-xs">Vente</button>
    </form>
    {% endif %}
  </div>
  {% else %}
  <div style="font-size:.67rem;color:var(--text-muted);padding-left:14px;font-family:var(--font-ui);">
    {{ row.embarcation.get_type_embarcation_display }}
  </div>
  {% endif %}
</div>
