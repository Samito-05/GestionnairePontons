{% extends 'pontons/admin/base_admin.html' %}
{% block title %}{{ titre }}{% endblock %}

{% block admin_content %}
<div class="page-header">
  <h1 class="page-title">{{ titre }}</h1>
  <a href="{% url 'admin_pontons' %}" class="btn btn-ghost"><svg class="icon"><use href="#i-arrow-left"/></svg>Pontons</a>
</div>

<div class="form-panel">
  <form method="post">
    {% csrf_token %}
    {% include 'pontons/admin/_form_fields.html' %}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary btn-lg">Enregistrer</button>
      <a href="{% url 'admin_pontons' %}" class="btn btn-ghost btn-lg">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
