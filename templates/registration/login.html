<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Connexion — Pontons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="manifest" href="/static/manifest.json">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #07111f;
      --surface:       #0c1a2e;
      --surface-2:     #112236;
      --border:        rgba(80,140,220,.09);
      --border-bright: rgba(100,170,255,.2);
      --accent:        #c8942e;
      --accent-dim:    rgba(200,148,46,.13);
      --danger:        #e2596b;
      --danger-dim:    rgba(226,89,107,.12);
      --text:          #d8e8f6;
      --text-muted:    #607e9c;
      --text-dim:      #2a4060;
    }

    html, body {
      min-height: 100vh;
      font-family: 'Outfit', sans-serif;
      color: var(--text);
    }

    body {
      background:
        radial-gradient(ellipse 90% 55% at 15% 85%, rgba(10,45,100,.45) 0%, transparent 55%),
        radial-gradient(ellipse 70% 45% at 85% 15%, rgba(200,148,46,.06) 0%, transparent 50%),
        radial-gradient(ellipse 100% 60% at 50% 110%, rgba(5,30,70,.7) 0%, transparent 50%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 80px,
          rgba(100,170,255,.016) 80px, rgba(100,170,255,.016) 81px);
      pointer-events: none;
    }

    .login-wrap {
      width: 100%;
      max-width: 390px;
      position: relative;
    }

    /* Brand */
    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-logo {
      width: 54px; height: 54px;
      background: linear-gradient(140deg, var(--accent), #7a4e10);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      color: #05090f;
      margin: 0 auto .9rem;
      box-shadow: 0 0 30px rgba(200,148,46,.2), 0 8px 30px rgba(0,0,0,.4);
    }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      font-weight: 700;
      display: block;
      margin-bottom: .28rem;
    }

    .brand-sub {
      font-size: .8rem;
      color: var(--text-muted);
      letter-spacing: .04em;
    }

    /* Card */
    .login-card {
      background: var(--surface-2);
      border: 1px solid var(--border-bright);
      border-radius: 14px;
      padding: 2rem;
      box-shadow: 0 24px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(100,170,255,.04);
    }

    /* Error */
    .error-box {
      display: flex;
      align-items: center;
      gap: .55rem;
      padding: .7rem .9rem;
      background: var(--danger-dim);
      border: 1px solid rgba(226,89,107,.28);
      border-radius: 8px;
      color: var(--danger);
      font-size: .84rem;
      margin-bottom: 1.4rem;
    }

    /* Form */
    .form-field { margin-bottom: 1.15rem; }

    .form-label {
      display: block;
      font-size: .77rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: .42rem;
    }

    .input-wrap { position: relative; }

    .input-icon {
      position: absolute;
      left: .85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: .78rem;
      pointer-events: none;
    }

    input[type=text],
    input[type=password] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border-bright);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: .9rem;
      padding: .65rem .9rem .65rem 2.35rem;
      outline: none;
      transition: border-color .16s, box-shadow .16s;
      -webkit-appearance: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    input::placeholder { color: var(--text-dim); }

    .btn-login {
      width: 100%;
      padding: .72rem;
      background: var(--accent);
      color: #05090f;
      border: none;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: .93rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      margin-top: 1.4rem;
      transition: filter .16s, transform .1s;
      letter-spacing: .02em;
    }
    .btn-login:hover  { filter: brightness(1.1); }
    .btn-login:active { transform: scale(.98); }

    .login-footer {
      text-align: center;
      margin-top: 1.1rem;
    }
    .login-footer a {
      color: var(--text-muted);
      font-size: .8rem;
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      transition: color .16s;
    }
    .login-footer a:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="login-wrap">

    <div class="login-brand">
      <div class="brand-logo"><i class="fas fa-anchor"></i></div>
      <span class="brand-name">Gestionnaire Pontons</span>
      <span class="brand-sub">Location d'embarcations</span>
    </div>

    <div class="login-card">
      {% if form.errors %}
        <div class="error-box">
          <i class="fas fa-circle-exclamation"></i>
          Identifiant ou mot de passe incorrect.
        </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <div class="form-field">
          <label class="form-label">Identifiant</label>
          <div class="input-wrap">
            <i class="input-icon fas fa-user"></i>
            <input type="text" name="username" autofocus autocomplete="username" placeholder="Votre identifiant">
          </div>
        </div>

        <div class="form-field">
          <label class="form-label">Mot de passe</label>
          <div class="input-wrap">
            <i class="input-icon fas fa-lock"></i>
            <input type="password" name="password" autocomplete="current-password" placeholder="••••••••">
          </div>
        </div>

        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit" class="btn-login">
          <i class="fas fa-right-to-bracket"></i>
          Se connecter
        </button>
      </form>

      <div class="login-footer">
        <a href="{% url 'planning' %}">
          <i class="fas fa-eye"></i> Voir le planning sans connexion
        </a>
      </div>
    </div>

  </div>

  <script>
    if ('serviceWorker' in navigator)
      navigator.serviceWorker.register('/static/sw.js').catch(() => {});
  </script>
</body>
</html>
